name: Python tests

on:
  push:
    branches:
      - main
      - "issue-*"
      - "ralph/**"
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Run pytest
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest
