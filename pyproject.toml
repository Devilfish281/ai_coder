[project]
name = "ai-coder"
version = "0.1.0"
description = ""
authors = [
    {name = "Devilfish281",email = "Dobley@csu.fullerton.edu"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "langgraph (>=1.1.10,<2.0.0)",
    "langchain-core (>=1.3.3,<2.0.0)",
    "langchain (>=1.2.17,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "langchain-openai (>=1.2.1,<2.0.0)"
]

[tool.poetry]
packages = [{include = "ai_coder", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]



[dependency-groups]
dev = [
    "pytest (>=8.0.0,<9.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
